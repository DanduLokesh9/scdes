citation: "SCDES AI Governance Framework \xA74 (Measurable Value); SCDES AI Operations\
  \ Manual \xA720 (Portfolio Management)"
statement: "Every programme uses AI it can trust \u2014 to cut permit backlog, target\
  \ inspections by risk, and answer the public faster \u2014 without a person ever\
  \ losing the final call."
pillars:
  Protect: Protect public health and the environment through faster, better-targeted
    regulatory work.
  Promote: Promote economic activity by making permitting predictable and timely.
  Pursue: Pursue capability the agency does not yet have, sequenced behind the foundations
    that make it safe.
category_progression: Category 1 builds internal competence, Category 2 extends it
  to public and economic benefit, Category 3 pursues new capability. The portfolio
  climbs in that order.

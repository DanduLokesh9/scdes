<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="GoverningAI">
  <!-- Every browser asks for a favicon on every visit, so its absence was
       three 404s per page load in the access log and a broken tile in the tab
       strip. Drawn rather than fetched: no request, no colour-mode flash, and
       it scales to whatever size the browser wants.

       A pediment on columns — the plainest available shorthand for a public
       body, and deliberately not a robot or a spark. -->
  <rect width="32" height="32" rx="7" fill="#12222a"/>
  <g fill="#e8c98a">
    <!-- The pediment. -->
    <path d="M16 6 L26 12 H6 Z"/>
    <!-- Three columns, and the plinth they stand on. -->
    <rect x="9"  y="14" width="2.6" height="9"/>
    <rect x="14.7" y="14" width="2.6" height="9"/>
    <rect x="20.4" y="14" width="2.6" height="9"/>
    <rect x="6" y="24" width="20" height="2.4" rx="1"/>
  </g>
</svg>

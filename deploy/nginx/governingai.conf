# nginx reverse proxy: the public port 80/443 in front of the app on 127.0.0.1:8765.
#
# Install:  sudo cp governingai.conf /etc/nginx/sites-available/governingai
#           sudo ln -sf /etc/nginx/sites-available/governingai /etc/nginx/sites-enabled/
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx
#
# Certbot edits this file when TLS is issued: it adds the 443 server block and a
# redirect. Run it only after the DNS name resolves to this host.

server {
    listen 80;
    listen [::]:80;
    server_name app.staging.governingai.us;

    # The appendix workbooks are a few hundred KB; the default 1 MB is enough,
    # but be explicit so an upload failing is never a mystery.
    client_max_body_size 8m;

    # This is a staging host for an application with no authentication of its
    # own. Anyone who finds the address can act as the Council. Until real auth
    # exists, put a password on the whole site:
    #
    #   sudo apt-get install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd yourname
    #
    # then uncomment the two lines below and reload nginx.
    #
    # auth_basic "Governing AI — staging";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        # Without these the app sees every request as coming from localhost, and
        # any redirect it issues would point at 127.0.0.1.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Retrieval and the risk engine are fast, but re-indexing the corpus on
        # first boot is not. Long enough to cover it, short enough to notice a hang.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }

    # Let Certbot answer its own challenge over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    access_log /var/log/nginx/governingai.access.log;
    error_log  /var/log/nginx/governingai.error.log;
}
